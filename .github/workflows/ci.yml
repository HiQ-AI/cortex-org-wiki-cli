name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/cortex-org-wiki-test-config
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Compile the actual native CLI
        run: bun build src/cli.ts --compile --outfile "${{ runner.temp }}/cortex-org-wiki-test${{ runner.os == 'Windows' && '.exe' || '' }}"
      - run: npm run test:bin
        env:
          CORTEX_ORG_WIKI_TEST_BINARY: ${{ runner.temp }}/cortex-org-wiki-test${{ runner.os == 'Windows' && '.exe' || '' }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/cortex-org-wiki-test-config
