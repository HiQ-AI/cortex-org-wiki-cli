# Publish a release on a version tag.
#
# Four delivery channels, none of which asks a consumer for a token:
#   1. Native binaries — single-file executables for macOS / Linux / Windows,
#      cross-compiled by `bun build --compile`. No runtime on the machine.
#   2. install.sh / install.ps1 — one-liners that fetch (1) from the Release.
#   3. npm — Trusted Publishing (OIDC), so agent hosts that already have Node
#      can `npx @hiq-ai/cortex-org-wiki-cli` with nothing installed. NO npm token and
#      NO repo secret; npm generates provenance from the OIDC claim. One-time
#      setup: publish 0.1.0 by hand, then add this repo+workflow as a Trusted
#      Publisher in the package's npmjs.com settings.
#   4. GitHub Release — binaries, skill ZIP, Agent guide, checksums and npm tarball.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm Trusted Publishing (OIDC) + provenance

# Transfer drafts are never published or overwritten. Keep them for failed-job
# reruns; see .github/RELEASE-HANDOFF.md for the reviewed manual cleanup policy.
# Producer attempt and manifest hash travel through job outputs, so a consumer-only
# rerun still reads the original producer rather than a candidate from a newer run.
jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.handoff.outputs.release_id }}
      attempt: ${{ steps.handoff.outputs.attempt }}
      manifest_sha256: ${{ steps.handoff.outputs.manifest_sha256 }}
    steps:
      # Every v* tag: the build embeds earlier official skill digests so installs upgrade them.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: npm ci
      - run: npm test
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/cortex-org-wiki-test-config
      - run: npm pack --ignore-scripts
      - name: Stage npm-package in a private draft Release
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-handoff.mjs upload npm-package .

  # Runs on macOS because only a Mac can codesign the Darwin binaries; Bun
  # cross-compiles the Linux and Windows targets from here just as well.
  binaries:
    needs: package
    runs-on: macos-latest
    outputs:
      release_id: ${{ steps.handoff.outputs.release_id }}
      attempt: ${{ steps.handoff.outputs.attempt }}
      manifest_sha256: ${{ steps.handoff.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # npm, not `bun install`: the binaries and the npm package then resolve
      # through the same package-lock.json and cannot drift apart.
      - run: npm ci
      - run: ./scripts/build-binaries.sh
      - name: Verify the compiled macOS release binary
        run: CORTEX_ORG_WIKI_TEST_BINARY="$PWD/dist-bin/cortex-org-wiki-darwin-$(node -p 'process.arch')" npm run test:bin
      - name: Stage binaries in a private draft Release
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-handoff.mjs upload binaries dist-bin

  npm:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # ≥ 22.14, required by trusted publishing
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm ≥ 11.5.1; Node 22 still bundles npm 10.x.
      - run: npm install -g npm@latest
      - name: Verify and retrieve npm-package from the producer draft
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_ID: ${{ needs.package.outputs.release_id }}
          TRANSFER_ATTEMPT: ${{ needs.package.outputs.attempt }}
          TRANSFER_MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
        run: node .github/scripts/release-handoff.mjs download npm-package npm-package
      - name: Publish to npm (Trusted Publishing — no token)
        run: npm publish ./npm-package/*.tgz --access public --provenance --ignore-scripts

  github:
    needs: [package, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and retrieve npm-package from the producer draft
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_ID: ${{ needs.package.outputs.release_id }}
          TRANSFER_ATTEMPT: ${{ needs.package.outputs.attempt }}
          TRANSFER_MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
        run: node .github/scripts/release-handoff.mjs download npm-package npm-package
      - name: Verify and retrieve binaries from the producer draft
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_ID: ${{ needs.binaries.outputs.release_id }}
          TRANSFER_ATTEMPT: ${{ needs.binaries.outputs.attempt }}
          TRANSFER_MANIFEST_SHA256: ${{ needs.binaries.outputs.manifest_sha256 }}
        run: node .github/scripts/release-handoff.mjs download binaries dist-bin
      - name: Create or verify immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-publish.mjs dist-bin/* npm-package/*.tgz

  # 国内直连 GitHub 不通,CDN 才是用户实际走的下载源 —— 跟着发布一起推,
  # 不能等人想起来手动跑,否则 install.sh 会一直装到旧版本。
  mirror-cdn:
    needs: github
    runs-on: ubuntu-latest
    env:
      DOWNLOAD_S3_BUCKET: ${{ vars.DOWNLOAD_S3_BUCKET }}
      DOWNLOAD_CF_DIST_ID: ${{ vars.DOWNLOAD_CF_DIST_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DOWNLOAD_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: ./scripts/mirror-to-cdn.sh "$GITHUB_REF_NAME"

  # The installers are the path most users take, so they get exercised against
  # the real Release — with no version pinned, so this covers the default
  # `releases/latest/download` resolution too.
  verify-install:
    needs: mirror-cdn
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      # 装的是 CDN 上那一份 —— 用户复制粘贴的就是这一行,连同镜像是否推上去
      # 一起验;跑仓里的副本只能证明脚本本身没写错。
      - name: install.sh (CDN)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://download.hiq.earth/cli/cortex-org-wiki/install.sh | sh -s -- --agent codex --project "$RUNNER_TEMP/wiki-project" --install-dir "$RUNNER_TEMP/wiki-bin" > "$RUNNER_TEMP/install.json"
          node -e 'const [line, ...rest] = require("fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean); const data = JSON.parse(line).data; if (rest.length || data.cli.version !== process.env.GITHUB_REF_NAME.slice(1) || data.skills[0].status !== "installed") process.exit(1)' "$RUNNER_TEMP/install.json"
          "$RUNNER_TEMP/wiki-bin/cortex-org-wiki" version
          test -s "$RUNNER_TEMP/wiki-project/.agents/skills/cortex-org-wiki/SKILL.md"
      - name: install.ps1 (CDN)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://download.hiq.earth/cli/cortex-org-wiki/install.ps1))) -Agent codex -Project "$env:RUNNER_TEMP\wiki-project" -InstallDir "$env:RUNNER_TEMP\wiki-bin"
          & "$env:RUNNER_TEMP\wiki-bin\cortex-org-wiki.exe" version
          if (-not (Test-Path "$env:RUNNER_TEMP\wiki-project\.agents\skills\cortex-org-wiki\SKILL.md")) { throw 'skill not installed' }
      - name: Verify the downloaded native CLI against local fixtures
        run: npm run test:bin
        env:
          CORTEX_ORG_WIKI_TEST_BINARY: ${{ runner.temp }}/wiki-bin/cortex-org-wiki${{ runner.os == 'Windows' && '.exe' || '' }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/wiki-test-config
